x-zeebe-template: &zeebe-broker
  image: camunda/zeebe:8.5.17
  healthcheck:
    test: [ "CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1" ]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s
  environment:
    - ZEEBE_LOG_LEVEL=info
    - ZEEBE_BROKER_CLUSTER_CLUSTERSIZE=3
    - ZEEBE_BROKER_CLUSTER_INITIALCONTACTPOINTS=zeebe:26502,zeebe_1:26502,zeebe_2:26502
    - ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT=1
    - ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR=3
    - ZEEBE_BROKER_EXPORTERS_METRICS_ENABLED=true
    - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
    - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
    - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_INDEX_PREFIX=zeebe-record
    - ZEEBE_GATEWAY_SECURITY_AUTHENTICATION_MODE=none
  env_file:  # additional env that has not shared on git
    - path: .env
      required: false
  group_add:
    - "1000"

services:
  zeebe_node_0:
    <<: *zeebe-broker
  zeebe_node_1:
    <<: *zeebe-broker
  zeebe_node_2:
    <<: *zeebe-broker
