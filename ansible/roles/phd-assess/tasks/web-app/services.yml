- name: Web app Service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "web-app-service"
        namespace: "{{ openshift_namespace }}"
      spec:
        type: ClusterIP
        ports:
          - name: "http-web"
            port: 80
            protocol: TCP
            targetPort: 3000
        selector:
          deployment.name: "web-app"
