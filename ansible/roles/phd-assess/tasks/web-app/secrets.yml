- name: Web app secrets
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ meteor_secrets_name }}"
        namespace: "{{ openshift_namespace }}"
      stringData:
        API_EPFL_CH_TOKEN:
          "{{
            lookup('file', '/keybase/team/epfl_phdassess/API_EPFL_CH_TOKEN')
          }}"
        MONGO_PERSISTENT_URL:
          "{{
            lookup('file', keybase_secrets_folder + 'MONGO_PERSISTENT_URL') 
            if web_app_secret_mongo_persistent_db else web_app_mongo_url
          }}"

- name: Entra auth config secrets
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ meteor_entra_auth_secrets_name  }}"
        namespace: "{{ openshift_namespace }}"
      stringData:
        AUTH_ENTRA_TENANT_ID:
          "{{
            lookup('file', '{{ keybase_secrets_folder }}/AUTH_ENTRA_TENANT_ID')
          }}"
        AUTH_ENTRA_CLIENT_ID:
          "{{
            lookup('file', '{{ keybase_secrets_folder }}/AUTH_ENTRA_CLIENT_ID')
          }}"
        AUTH_ENTRA_SECRET:
          "{{
            lookup('file', '{{ keybase_secrets_folder }}/AUTH_ENTRA_SECRET')
          }}"
