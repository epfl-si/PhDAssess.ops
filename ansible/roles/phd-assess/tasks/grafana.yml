- name: PhD GrafanaFolder
  kubernetes.core.k8s:
    state: present
    definition:
      kind: GrafanaFolder
      apiVersion: grafana.integreatly.org/v1beta1
      metadata:
        name: phd-assess
        namespace: '{{ openshift_namespace }}'
      spec:
        allowCrossNamespaceImport: true
        instanceSelector:
          matchLabels:
            dashboards: '{{ grafana_dashboard_instance }}'
        title: "{{ grafana_folder_name }}"
