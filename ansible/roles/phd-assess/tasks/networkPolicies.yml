- name: Set network policy to allow scraping monitoring data
  kubernetes.core.k8s:
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: workload-monitoring
        namespace: '{{ openshift_namespace }}'
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector: {}
              - namespaceSelector:
                  matchLabels:
                    network.openshift.io/policy-group: ingress
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: openshift-user-workload-monitoring
