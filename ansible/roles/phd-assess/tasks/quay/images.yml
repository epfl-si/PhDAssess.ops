- name: Images - Pull the MongoDB for web-app
  community.docker.docker_image:
    name: "{{ db_image_name }}"
    tag: "{{ db_image_tag }}"
    source: pull

- name: Images - Tag and push the MongoDB
  community.docker.docker_image:
    name: "{{ db_image_name }}"
