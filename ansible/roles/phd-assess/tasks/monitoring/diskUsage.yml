- name: Applying disk-usage-exporter deployment...
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "disk-usage-exporter"
        namespace: "{{ openshift_namespace }}"
        labels:
          app.kubernetes.io/name: "disk-usage-exporter"
          app.kubernetes.io/component: "monitoring"
          app.kubernetes.io/part-of: "monitoring"
          app.kubernetes.io/managed-by: "ansible"
        annotations:
          app.openshift.io/vcs-uri: "https://github.com/epfl-si/PhDAssess/tree/master/docker/monitoring"
          app.openshift.io/connects-to: "zeebe-0"
      spec:
        replicas: 1
        strategy:
          resources:
            limits:
              cpu: "50m"
              memory: "100Mi"
        selector:
          matchLabels:
            app.kubernetes.io/instance: "disk-usage-exporter"
        template:
          metadata:
            labels:
              app.kubernetes.io/instance: "disk-usage-exporter"
          spec:
            serviceAccountName: "{{ quay_service_account_name }}"
            containers:
              - name: disk-usage-exporter
                image: "{{ monitoring_node_disk_usage_exporter_image }}:latest"
#                volumeMounts:
#                  - name: zeebe-data
#                    mountPath: /usr/local/zeebe/data
                env:
                  - name: "DISK_USAGE_TARGETS"
                    value: "/usr/local/zeebe/data;/usr/local/zeebe/data/raft-partition/partitions/1/snapshots"
                resources:
                  requests:
                    cpu: "5m"
                    memory: "50Mi"
                  limits:
                    cpu: "50m"
                    memory: "100Mi"
                ports:
                  - name: metrics
                    containerPort: 3000
#            volumes:
#              - name: zeebe-data
#                persistentVolumeClaim:
#                  claimName: "{{ volume_zeebe_name }}"
