- name: Zeebe backuper CronJob
  kubernetes.core.k8s:
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: zeebe-backuper
        namespace: '{{ openshift_namespace }}'
        labels:
          app.kubernetes.io/name: "zeebe-s3-backuper"
          app.kubernetes.io/component: "backend"
          app.kubernetes.io/part-of: "zeebe-quorum"
      spec:
        schedule: "{{ zeebe_backup_automatic_schedule }}"
        backoffLimit: 0
        successfulJobsHistoryLimit: 3
        failedJobsHistoryLimit: 3
        concurrencyPolicy: Forbid
        jobTemplate:
          spec:
            backoffLimit: 0
            template:
              spec:
                serviceAccountName: "{{ quay_service_account_name }}"
                activeDeadlineSeconds: 1200
                restartPolicy: Never
                containers:
                  - name: zeebe-backuper
                    image: "{{ quay_repo }}/zeebe-backuper:prod"
                    imagePullPolicy: Always
                    env:
                      # API URL to trigger Zeebe backup
                      - name: ZEEBE_API_URL
                        value: "http://zeebe-quorum-0:9600"
                      # API URL to trigger Elasticsearch snapshot
                      - name: ES_API_URL
                        value: "http://elasticsearch:9200"
                      - name: ES_SNAPSHOT_REPO
                        value: "zeebe-es-snapshots"
                    resources:
                      requests:
                        cpu: "5m"
                        memory: "300Mi"
                      limits:
                        memory: "300Mi"
