- name: S3 secrets for the Zeebe Broker
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ zeebe_secrets_name }}-s3"
        namespace: "{{ openshift_namespace }}"
      stringData:
        ZEEBE_BROKER_DATA_BACKUP_STORE: "S3"
        ZEEBE_BROKER_DATA_BACKUP_S3_REGION: "eu-central-2"
        ZEEBE_BROKER_DATA_BACKUP_S3_ENDPOINT: "https://s3.epfl.ch"
        ZEEBE_BROKER_DATA_BACKUP_S3_BUCKETNAME:
          "{{ lookup('file',
              zeebe_backup_s3_bucket_name_file)
          }}"
        ZEEBE_BROKER_DATA_BACKUP_S3_ACCESSKEY:
          "{{ lookup('file',
              zeebe_backup_s3_access_key_file)
          }}"
        ZEEBE_BROKER_DATA_BACKUP_S3_SECRETKEY:
          "{{ lookup('file',
              zeebe_backup_s3_secret_key_file)
          }}"
